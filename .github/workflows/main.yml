name: PROJECT-OPICK-X110-FINAL-STRIKE-V4.10-TRUE-FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Jakarta
      CLANG_VERSION: "clang-r416183b"
      CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"
      GCC_VERSION: "11"

    steps:
      # 1. INSTALL DEPENDENCIES
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gzip bc cpio perl bison flex build-essential ca-certificates ccache clang lld curl gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev libssl-dev libxml2 libxml2-dev make python3 python3-distutils rsync unzip wget xz-utils zip coreutils linux-libc-dev device-tree-compiler

          echo "===== VERIFY REQUIRED HOST TOOLS ====="
          command -v bc
          bc --version | head -n 1
          test -x /usr/bin/bc
          command -v dtc
          command -v nl

      # 2. CLONE SOURCE & SUBMODULES
      - name: Clone Source & Submodules
        run: |
          git clone --depth=1 --branch 15.0 https://github.com/prabhatkrmishra/kernel_samsung_gta9.git gta9
          cd gta9
          git submodule sync --recursive
          git submodule update --init --depth=1

      # 3. TOOLCHAIN SETUP (WITH CACHE)
      - name: Cache Android Clang
        id: cache-clang
        uses: actions/cache@v3
        with:
          path: gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          key: final-strike-v3-${{ env.CLANG_VERSION }}

      - name: Download Android Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p gta9/prebuilts-master/clang/host/linux-x86
          curl -L --fail -o gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}.tar.gz ${{ env.CLANG_URL }}
          mkdir -p gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          tar -xzf gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}.tar.gz -C gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}

      # 4. SAMSUNG BUILD SYSTEM LAYOUT (Native Host Tools)
      - name: Configure Samsung Build Layout
        run: |
          cd gta9
          ln -sf . kernel-5.10
          ln -sf setup/kernel/build build

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}"
          export CLANG_ROOT
          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          mkdir -p "$TOOL_DIR"

          # V4 FIX:
          # build.sh rewrites PATH internally and later invokes "dtc" and "nl".
          # Keep those exact command names available in TOOL_DIR.
          ln -sf /usr/bin/dtc "$TOOL_DIR/dtc"
          ln -sf /usr/bin/nl "$TOOL_DIR/nl"

          # Kernel Kbuild invokes "bc" by command name while build.sh rewrites PATH.
          # Keep bc in the same private path to remove any PATH ambiguity.
          ln -sf /usr/bin/bc "$TOOL_DIR/bc"

          # Kernel Kbuild also invokes gzip by command name; keep it in TOOL_DIR.
          ln -sf /usr/bin/gzip "$TOOL_DIR/gzip"

          # arch/arm64/Makefile.postlink invokes "true" by command name.
          # build.sh rewrites PATH, so keep the coreutils binary in TOOL_DIR.
          ln -sf /usr/bin/true "$TOOL_DIR/true"

          # V4.5 CLANG DISPATCHER:
          #
          # The previous dispatcher had two subtle problems:
          #   1) "clang --version" was routed to GCC, so Kbuild believed CC
          #      was GCC and did not add --target=aarch64-linux-gnu.
          #   2) ARM64 invocations were forwarded to Android clang without
          #      forcing an ARM64 target.
          #
          # Fix both problems:
          #   - version/probe queries go to Android clang
          #   - ARM64 compile invocations always get --target=aarch64-linux-gnu
          #   - host invocations still go to Ubuntu GCC/G++
          CLANG_ROOT="$CLANG_ROOT"

          cat > "$TOOL_DIR/clang" <<'EOF'
          #!/usr/bin/env bash
          set -e

          TARGET=0
          HAS_TARGET=0

          for arg in "$@"; do
          case "$arg" in
          --target=*)
          HAS_TARGET=1
          TARGET=1
          ;;
          -target)
          TARGET=1
          ;;
          -mlittle-endian|-mbig-endian|-mabi=lp64|-mabi=lp64f|-mabi=lp64d|-mno-outline-atomics|-moutline-atomics|-march=armv8*|-march=arm9*|-mcpu=cortex-a*|-mcpu=neoverse*|-mstrict-align)
          TARGET=1
          ;;
          esac
          done

          # Kbuild probes "CC --version" to decide whether to inject CLANG_FLAGS.
          # Never send that probe to GCC, or Kbuild will omit --target.
          for arg in "$@"; do
          case "$arg" in
          --version|-dumpversion)
          exec "__CLANG_ROOT__/bin/clang" "$@"
          ;;
          esac
          done

          if [ "$TARGET" -eq 1 ]; then
          if [ "$HAS_TARGET" -eq 0 ]; then
          exec "__CLANG_ROOT__/bin/clang" --target=aarch64-linux-gnu "$@"
          fi
          exec "__CLANG_ROOT__/bin/clang" "$@"
          fi

          args=()
          skip_next=0

          for arg in "$@"; do
          if [ "$skip_next" -eq 1 ]; then
          skip_next=0
          continue
          fi

          case "$arg" in
          --rtlib=compiler-rt)
          ;;
          -nostdinc)
          ;;
          -isystem)
          skip_next=1
          ;;
          -fuse-ld=lld)
          ;;
          *)
          args+=("$arg")
          ;;
          esac
          done

          exec /usr/bin/gcc "${args[@]}"
          EOF
          chmod +x "$TOOL_DIR/clang"

          cat > "$TOOL_DIR/clang++" <<'EOF'
          #!/usr/bin/env bash
          set -e

          TARGET=0
          HAS_TARGET=0

          for arg in "$@"; do
          case "$arg" in
          --target=*)
          HAS_TARGET=1
          TARGET=1
          ;;
          -target)
          TARGET=1
          ;;
          -mlittle-endian|-mbig-endian|-mabi=lp64|-mabi=lp64f|-mabi=lp64d|-mno-outline-atomics|-moutline-atomics|-march=armv8*|-march=arm9*|-mcpu=cortex-a*|-mcpu=neoverse*|-mstrict-align)
          TARGET=1
          ;;
          esac
          done

          for arg in "$@"; do
          case "$arg" in
          --version|-dumpversion)
          exec "__CLANG_ROOT__/bin/clang++" "$@"
          ;;
          esac
          done

          if [ "$TARGET" -eq 1 ]; then
          if [ "$HAS_TARGET" -eq 0 ]; then
          exec "__CLANG_ROOT__/bin/clang++" --target=aarch64-linux-gnu "$@"
          fi
          exec "__CLANG_ROOT__/bin/clang++" "$@"
          fi

          args=()
          skip_next=0

          for arg in "$@"; do
          if [ "$skip_next" -eq 1 ]; then
          skip_next=0
          continue
          fi

          case "$arg" in
          --rtlib=compiler-rt)
          ;;
          -nostdinc)
          ;;
          -isystem)
          skip_next=1
          ;;
          -fuse-ld=lld)
          ;;
          *)
          args+=("$arg")
          ;;
          esac
          done

          exec /usr/bin/g++ "${args[@]}"
          EOF
          chmod +x "$TOOL_DIR/clang++"

          # Embed the absolute Android clang path into both wrappers.
          sed -i "s#__CLANG_ROOT__#$CLANG_ROOT#g" "$TOOL_DIR/clang" "$TOOL_DIR/clang++"

          # Make CLANG_PREBUILT_BIN point at the dispatch directory itself.
          # _setup_env.sh prepends CLANG_PREBUILT_BIN to PATH, so this makes
          # the dispatcher the actual "clang" seen by build.sh/Kbuild.
          for tool in "$CLANG_ROOT"/bin/llvm-* "$CLANG_ROOT"/bin/ld.lld; do
            [ -e "$tool" ] || continue
            ln -sf "$tool" "$TOOL_DIR/$(basename "$tool")"
          done

          ln -sf /usr/bin/ld.lld "$TOOL_DIR/ld.lld"
          ln -sf /usr/bin/ld.lld "$TOOL_DIR/lld"
          ln -sf /usr/bin/realpath "$TOOL_DIR/realpath"

          echo "===== VERIFY V4.5 CLANG DISPATCHER ====="

          printf 'int main(void){return 0;}\n' > /tmp/dispatch-host.c
          "$TOOL_DIR/clang" -c /tmp/dispatch-host.c -o /tmp/dispatch-host.o
          test -s /tmp/dispatch-host.o

          printf 'void x(void){}\n' > /tmp/dispatch-target.c
          "$TOOL_DIR/clang" -mlittle-endian -c /tmp/dispatch-target.c -o /tmp/dispatch-target.o
          test -s /tmp/dispatch-target.o

          echo "HOST DISPATCH TEST: OK"
          echo "ARM64 DISPATCH TEST: OK"

          echo "===== VERIFY CLANG TARGET ====="
          "$TOOL_DIR/clang" --version | head -n 2
          "$TOOL_DIR/clang" -### --target=aarch64-linux-gnu -mcpu=cortex-a55 \
            -c /tmp/dispatch-target.c -o /tmp/dispatch-target2.o 2>&1 | head -n 40

          COMMANDS="python3 env bash flex bison bc cpio perl gzip true echo printf sleep ar as awk basename bash cat chmod cmp cp cut date dirname du env expr find grep head ld ln ls md5sum mkdir mktemp mv nproc objcopy objdump od printf pwd readlink rm sed sort stat tail tar test touch tr uname uniq wc which xargs zip xz make gcc g++ aarch64-linux-gnu-gcc aarch64-linux-gnu-g++ arm-linux-gnueabi-gcc arm-linux-gnueabi-g++"

          for cmd in $COMMANDS; do
            target="$(type -P "$cmd" || true)"
            [ -n "$target" ] && ln -sf "$target" "$TOOL_DIR/$cmd"
          done

          COMPAT_DIR="$CLANG_ROOT/compat-libs"
          mkdir -p "$COMPAT_DIR"

          SYSTEM_LIBXML="$(ldconfig -p | grep 'libxml2.so.2 ' | head -n 1 | sed 's/.*=> //')"
          ln -sf "$SYSTEM_LIBXML" "$COMPAT_DIR/libxml2.so.2.9.10"

          echo "===== VERIFY V4.10 HOST TOOL LINKS ====="
          ls -l "$TOOL_DIR/dtc" "$TOOL_DIR/nl" "$TOOL_DIR/bc" "$TOOL_DIR/cpio" "$TOOL_DIR/gzip" "$TOOL_DIR/perl" "$TOOL_DIR/true"

          "$TOOL_DIR/dtc" --version | head -n 1
          "$TOOL_DIR/nl" --version | head -n 1 || true
          "$TOOL_DIR/bc" --version | head -n 1
          "$TOOL_DIR/ls" --version | head -n 1
          "$TOOL_DIR/md5sum" --version | head -n 1
          printf '1+1\n' | "$TOOL_DIR/bc" -q | grep -qx '2'
          "$TOOL_DIR/xz" --version | head -n 1
          "$TOOL_DIR/cpio" --version | head -n 1
          "$TOOL_DIR/perl" --version | head -n 2
          "$TOOL_DIR/gzip" --version | head -n 1
          "$TOOL_DIR/true" --version | head -n 1

      # 5. GENERATE CONFIG (Clean & No Typo)
      - name: Generate Build Config
        run: |
          cd gta9
          rm -rf out
          mkdir -p out

          # Memastikan tidak ada // pada path script
          python3 -m lib2to3 -w scripts/gen_build_config.py

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user -o out/build.config

      # 6. ENV INJECTION
      - name: Set Global Environment
        run: |
          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}"

          sed -i "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=$PWD/build/build-tools/path/linux-x86#" out/build.config

          echo "C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu:/usr/include" >> $GITHUB_ENV
          echo "CPLUS_INCLUDE_PATH=/usr/include/x86_64-linux-gnu:/usr/include" >> $GITHUB_ENV
          echo "PATH=$PWD/build/build-tools/path/linux-x86:\$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$CLANG_ROOT/compat-libs:\$LD_LIBRARY_PATH" >> $GITHUB_ENV

      # 7. THE BUILD EXECUTION
      - name: Execute Kernel Build
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
          OUT_DIR: out
          DIST_DIR: out
          BUILD_CONFIG: out/build.config
          HOSTCC: /usr/bin/gcc
          HOSTCXX: /usr/bin/g++
          HOSTLD: /usr/bin/gcc
          KCFLAGS: "-Wno-error"

        run: |
          set -eux
          cd gta9

          chmod +x build/build.sh

          echo "===== PRE-BUILD HOST TOOL CHECK ====="

          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v bc
          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v ls
          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v md5sum
          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v xz
          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v cpio
          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v perl
          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v gzip
          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" command -v true

          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" bc --version | head -n 1

          PATH="$PWD/build/build-tools/path/linux-x86:/usr/bin:/bin" printf '250\n' \
            | bc -q "$PWD/kernel-5.10/kernel/time/timeconst.bc" \
            >/tmp/timeconst-probe.h

          test -s /tmp/timeconst-probe.h

          # V4.5:
          # Keep HOSTCC/HOSTCXX/HOSTLD in the job environment; dispatcher handles LLVM host/target split.
          # Do not pass them as build.sh arguments. LLVM=1 makes build.sh use
          # clang for CC/HOSTCC; the TOOL_DIR dispatcher sends host invocations
          # to GCC and ARM64 invocations to Android clang-r416183b.
          #
          # DTC remains the explicit native path; TOOL_DIR/dtc protects
          # the internal build.sh PATH.

          bash ./build/build.sh LLVM_IAS=1 DTC=/usr/bin/dtc V=1 -j"$(($(nproc)-1))"

      # 8. RESULT EXTRACTION
      - name: Package and Upload
        if: success()
        run: |
          set -eux
          cd gta9

          echo "===== VERIFY FINAL KERNEL OUTPUTS ====="

          IMAGE="$(find out -type f -name 'Image.gz' -print -quit)"
          DTB="$(find out -type f -name 'mt6789.dtb' -print -quit)"
          DTBO="$(find out -type f -name 'mt8781_gta9_eur_open_00.dtbo' -print -quit)"

          test -n "$IMAGE"
          test -n "$DTB"
          test -n "$DTBO"

          test -s "$IMAGE"
          test -s "$DTB"
          test -s "$DTBO"
          test -s out/.config
          test -s out/build.config

          rm -rf package
          mkdir -p package

          cp "$IMAGE" package/Image.gz
          cp "$DTB" package/mt6789.dtb
          cp "$DTBO" package/mt8781_gta9_eur_open_00.dtbo
          cp out/.config package/.config
          cp out/build.config package/build.config

          gzip -t package/Image.gz

          cd package

          zip -9 -r ../kernel-gta9-x110.zip \
            Image.gz \
            mt6789.dtb \
            mt8781_gta9_eur_open_00.dtbo \
            .config \
            build.config

          cd ..

          echo "===== VERIFY ZIP CONTENTS ====="

          unzip -l kernel-gta9-x110.zip

          unzip -Z1 kernel-gta9-x110.zip | grep -qx 'Image.gz'
          unzip -Z1 kernel-gta9-x110.zip | grep -qx 'mt6789.dtb'
          unzip -Z1 kernel-gta9-x110.zip | grep -qx 'mt8781_gta9_eur_open_00.dtbo'

          unzip -t kernel-gta9-x110.zip >/dev/null
          test -s kernel-gta9-x110.zip

      - name: Upload Final Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gta9-x110
          path: |
            gta9/kernel-gta9-x110.zip
            gta9/out/.config
            gta9/out/build.config
          if-no-files-found: error
          retention-days: 7
