name: PROJECT-OPICK-X110-FINAL-STRIKE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Jakarta
      CLANG_VERSION: "clang-r416183b"
      CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"
      GCC_VERSION: "11"

    steps:
      # 1. INSTALL DEPENDENCIES
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential ca-certificates ccache clang lld curl gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev libssl-dev libxml2 libxml2-dev make python3 python3-distutils rsync unzip wget xz-utils zip coreutils linux-libc-dev device-tree-compiler

      # 2. CLONE SOURCE & SUBMODULES
      - name: Clone Source & Submodules
        run: |
          git clone --depth=1 --branch 15.0 https://github.com/prabhatkrmishra/kernel_samsung_gta9.git gta9
          cd gta9
          git submodule sync --recursive
          git submodule update --init --depth=1

      # 3. TOOLCHAIN SETUP (WITH CACHE)
      - name: Cache Android Clang
        id: cache-clang
        uses: actions/cache@v3
        with:
          path: gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          key: final-strike-v2-${{ env.CLANG_VERSION }}

      - name: Download Android Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p gta9/prebuilts-master/clang/host/linux-x86
          curl -L --fail -o gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}.tar.gz ${{ env.CLANG_URL }}
          mkdir -p gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          tar -xzf gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}.tar.gz -C gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}

      # 4. SAMSUNG BUILD SYSTEM LAYOUT (Native Host Tools)
      - name: Configure Samsung Build Layout
        run: |
          cd gta9
          ln -sf . kernel-5.10
          ln -sf setup/kernel/build build

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}"
          export CLANG_ROOT
          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"
          mkdir -p "$TOOL_DIR"

          # V4 FIX:
          # build.sh rewrites PATH internally and later invokes "dtc" and "nl".
          # Keep those exact command names available in TOOL_DIR.
          ln -sf /usr/bin/dtc "$TOOL_DIR/dtc"
          ln -sf /usr/bin/nl "$TOOL_DIR/nl"

          # V4.4.1 CLANG DISPATCHER:
          #
          # Previous GCC-only wrapper fixed host linking, but also caught
          # ARM64 kernel compilation and forwarded -mlittle-endian to x86 GCC.
          #
          # Dispatch policy:
          #   ARM64-specific flags present -> Android clang-r416183b
          #   otherwise                  -> native Ubuntu GCC/G++
          #
          # Host-only clang flags are stripped only on the GCC path.
          CLANG_ROOT="$CLANG_ROOT"

          cat > "$TOOL_DIR/clang" <<'EOF'
          #!/usr/bin/env bash
          set -e

          TARGET=0

          for arg in "$@"; do
            case "$arg" in
              --target=aarch64*|--target=arm64*|-mlittle-endian|-mbig-endian|-mabi=lp64|-mabi=lp64f|-mabi=lp64d|-mno-outline-atomics|-moutline-atomics|-march=armv8*|-march=arm9*|-mcpu=cortex-a*|-mcpu=neoverse*|-mstrict-align)
                TARGET=1
                ;;
            esac
          done

          if [ "$TARGET" -eq 1 ]; then
            exec "__CLANG_ROOT__/bin/clang" "$@"
          fi

          args=()
          skip_next=0

          for arg in "$@"; do
            if [ "$skip_next" -eq 1 ]; then
              skip_next=0
              continue
            fi

            case "$arg" in
              --rtlib=compiler-rt)
                ;;
              -nostdinc)
                ;;
              -isystem)
                skip_next=1
                ;;
              -fuse-ld=lld)
                ;;
              *)
                args+=("$arg")
                ;;
            esac
          done

          exec /usr/bin/gcc "${args[@]}"
          EOF
          chmod +x "$TOOL_DIR/clang"

          cat > "$TOOL_DIR/clang++" <<'EOF'
          #!/usr/bin/env bash
          set -e

          TARGET=0

          for arg in "$@"; do
            case "$arg" in
              --target=aarch64*|--target=arm64*|-mlittle-endian|-mbig-endian|-mabi=lp64|-mabi=lp64f|-mabi=lp64d|-mno-outline-atomics|-moutline-atomics|-march=armv8*|-march=arm9*|-mcpu=cortex-a*|-mcpu=neoverse*|-mstrict-align)
                TARGET=1
                ;;
            esac
          done

          if [ "$TARGET" -eq 1 ]; then
            exec "__CLANG_ROOT__/bin/clang++" "$@"
          fi

          args=()
          skip_next=0

          for arg in "$@"; do
            if [ "$skip_next" -eq 1 ]; then
              skip_next=0
              continue
            fi

            case "$arg" in
              --rtlib=compiler-rt)
                ;;
              -nostdinc)
                ;;
              -isystem)
                skip_next=1
                ;;
              -fuse-ld=lld)
                ;;
              *)
                args+=("$arg")
                ;;
            esac
          done

          exec /usr/bin/g++ "${args[@]}"
          EOF
          chmod +x "$TOOL_DIR/clang++"

          # Embed the absolute Android clang path into both wrappers because
          # the wrapper runs in the later build step, where CLANG_ROOT is not
          # otherwise guaranteed to exist.
          sed -i "s#__CLANG_ROOT__#$CLANG_ROOT#g" "$TOOL_DIR/clang" "$TOOL_DIR/clang++"

          ln -sf /usr/bin/ld.lld "$TOOL_DIR/ld.lld"
          ln -sf /usr/bin/ld.lld "$TOOL_DIR/lld"
          ln -sf /usr/bin/realpath "$TOOL_DIR/realpath"

          echo "===== VERIFY V4.4.1 CLANG DISPATCHER ====="

          printf 'int main(void){return 0;}\n' > /tmp/dispatch-host.c
          "$TOOL_DIR/clang" -c /tmp/dispatch-host.c -o /tmp/dispatch-host.o
          test -s /tmp/dispatch-host.o

          printf 'void x(void){}\n' > /tmp/dispatch-target.c
          "$TOOL_DIR/clang" -mlittle-endian -c /tmp/dispatch-target.c -o /tmp/dispatch-target.o
          test -s /tmp/dispatch-target.o

          echo "HOST DISPATCH TEST: OK"
          echo "ARM64 DISPATCH TEST: OK"

          echo "===== VERIFY V4.2 HOST CLANG WRAPPERS ====="
          "$TOOL_DIR/clang" --version | head -n 2
          "$TOOL_DIR/clang++" --version | head -n 2

          COMMANDS="python3 env bash flex bison echo printf sleep ar as awk basename bash cat chmod cmp cp cut date dirname du env expr find grep head ld ln mkdir mktemp mv nproc objcopy objdump od printf pwd readlink rm sed sort stat tail tar test touch tr uname uniq wc which xargs zip make gcc g++ aarch64-linux-gnu-gcc aarch64-linux-gnu-g++ arm-linux-gnueabi-gcc arm-linux-gnueabi-g++"
          for cmd in $COMMANDS; do
            target="$(type -P "$cmd" || true)"
            [ -n "$target" ] && ln -sf "$target" "$TOOL_DIR/$cmd"
          done

          COMPAT_DIR="$CLANG_ROOT/compat-libs"
          mkdir -p "$COMPAT_DIR"
          SYSTEM_LIBXML="$(ldconfig -p | grep 'libxml2.so.2 ' | head -n 1 | sed 's/.*=> //')"
          ln -sf "$SYSTEM_LIBXML" "$COMPAT_DIR/libxml2.so.2.9.10"

          echo "===== VERIFY V4 TOOL LINKS ====="
          ls -l "$TOOL_DIR/dtc" "$TOOL_DIR/nl"
          "$TOOL_DIR/dtc" --version | head -n 1
          "$TOOL_DIR/nl" --version | head -n 1 || true

      # 5. GENERATE CONFIG (Clean & No Typo)
      - name: Generate Build Config
        run: |
          cd gta9
          rm -rf out
          mkdir -p out
          # Memastikan tidak ada // pada path script
          python3 -m lib2to3 -w scripts/gen_build_config.py
          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user -o out/build.config

      # 6. ENV INJECTION
      - name: Set Global Environment
        run: |
          cd gta9
          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}"

          sed -i "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=$CLANG_ROOT/bin#" out/build.config

          echo "C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu:/usr/include" >> $GITHUB_ENV
          echo "CPLUS_INCLUDE_PATH=/usr/include/x86_64-linux-gnu:/usr/include" >> $GITHUB_ENV
          echo "PATH=$PWD/build/build-tools/path/linux-x86:\$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$CLANG_ROOT/compat-libs:\$LD_LIBRARY_PATH" >> $GITHUB_ENV

      # 7. THE BUILD EXECUTION
      - name: Execute Kernel Build
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
          OUT_DIR: out
          DIST_DIR: out
          BUILD_CONFIG: out/build.config
          HOSTCC: /usr/bin/gcc
          HOSTCXX: /usr/bin/g++
          HOSTLD: /usr/bin/gcc
          KCFLAGS: "-Wno-error"
        run: |
          set -eux
          cd gta9
          chmod +x build/build.sh
          # V4.4.1: Keep HOSTCC/HOSTCXX/HOSTLD only in the job environment.
          # Do not pass them as build.sh arguments. The TOOL_DIR clang
          # dispatcher sends host invocations to GCC and ARM64 invocations
          # to Android clang-r416183b.
          # DTC remains the explicit native path; TOOL_DIR/dtc protects
          # the internal build.sh PATH.
          bash ./build/build.sh LLVM_IAS=1 DTC=/usr/bin/dtc -j"$(($(nproc)-1))"

      # 8. RESULT EXTRACTION
      - name: Package and Upload
        if: always()
        run: |
          set -eux
          cd gta9
          mkdir -p package
          find out -type f -name 'Image.gz' -exec cp {} package/ \; 2>/dev/null || true
          find out -type f -name '*.dtb' -exec cp {} package/ \; 2>/dev/null || true
          find out -type f -name '*.dtbo' -exec cp {} package/ \; 2>/dev/null || true
          cp out/build.config package/ 2>/dev/null || true
          cd package && zip -r ../kernel-gta9-x110.zip .

      - name: Upload Final Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gta9-x110
          path: |
            gta9/kernel-gta9-x110.zip
            gta9/out/.config
          retention-days: 7
